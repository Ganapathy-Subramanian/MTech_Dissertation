<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusCRM — System Throughput Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  // Fallback in case cdnjs is blocked on this network
  if (typeof Chart === 'undefined') {
    document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></scr' + 'ipt>');
  }
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-void:#060a12;--bg-card:#111827;--bg-card-soft:#0d1420;--bg-input:#0a1020;
  --border:#1e2d45;--border-soft:rgba(255,255,255,.06);
  --blue:#2a7fff;--blue-bright:#4d9fff;--blue-glow:rgba(42,127,255,.14);
  --green:#10d88e;--green-glow:rgba(16,216,142,.14);
  --orange:#f59e0b;--orange-glow:rgba(245,158,11,.14);
  --red:#ff4d6d;--purple:#a78bfa;--purple-glow:rgba(167,139,250,.14);
  --text-primary:#f0f4ff;--text-secondary:#8899b4;--text-muted:#57678a;
  --font-main:'Sora',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:16px;--radius-sm:10px;
}
html,body{min-height:100%;font-family:var(--font-main);background:
  radial-gradient(circle at 15% 0%, #0b1224 0%, var(--bg-void) 45%) fixed;
  color:var(--text-primary);}
body{padding-bottom:40px;}
.page{max-width:1440px;margin:0 auto;padding:24px 24px 8px;}

/* ── Topbar ───────────────────────────────────────────── */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;
  background:linear-gradient(135deg,#0e1c3a 0%,var(--bg-card) 60%);
  border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);}
.back-link{color:var(--text-muted);font-size:12.5px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:color .15s;}
.back-link:hover{color:var(--blue-bright);}
.topbar-title{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-top:6px;display:flex;align-items:center;gap:10px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,216,142,.6);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,216,142,.55);}70%{box-shadow:0 0 0 8px rgba(16,216,142,0);}100%{box-shadow:0 0 0 0 rgba(16,216,142,0);}}
.topbar-sub{font-size:12.5px;color:var(--text-secondary);margin-top:3px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{display:flex;align-items:center;gap:10px;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:9px 14px;font-size:12px;min-width:118px;}
.chip-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.chip .lbl{color:var(--text-muted);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
.chip .val{font-weight:700;font-family:var(--font-mono);font-size:13.5px;}
.chip.peak .chip-icon{background:var(--blue-glow);color:var(--blue-bright);}
.chip.time .chip-icon{background:var(--purple-glow);color:var(--purple);}
.chip.uptime .chip-icon{background:var(--orange-glow);color:var(--orange);}
.chip.sla{background:var(--green-glow);border-color:rgba(16,216,142,.35);}
.chip.sla .chip-icon{background:rgba(16,216,142,.22);color:var(--green);}
.chip.sla .val{color:var(--green);}

/* ── Layout grid ──────────────────────────────────────── */
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:18px;align-items:stretch;}
@media (max-width:980px){.grid{grid-template-columns:1fr;}}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;display:flex;flex-direction:column;}
.card-title{font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-title .badge-soft{color:var(--text-muted);font-weight:500;font-size:11px;background:var(--bg-input);
  border:1px solid var(--border-soft);padding:3px 9px;border-radius:20px;}

/* ── Chart wrappers (fixes Chart.js stretched-canvas bug) ──
   Chart.js needs a container with an EXPLICIT height; without one
   the canvas can stretch/distort (especially pie/doughnut charts). */
.chart-wrap{position:relative;width:100%;}
.chart-wrap.rpm{height:260px;}
.chart-wrap.gauge{height:190px;}
.chart-wrap.pie{width:190px;height:190px;flex-shrink:0;}

.insight{margin-top:14px;background:var(--blue-glow);border:1px solid rgba(42,127,255,.25);
  border-radius:var(--radius-sm);padding:11px 15px;font-size:12.5px;color:var(--text-secondary);
  display:flex;gap:8px;align-items:flex-start;}
.insight .ic{flex-shrink:0;}

.pie-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;flex:1;}
.legend-list{flex:1;min-width:190px;display:flex;flex-direction:column;gap:2px;}
.legend-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;
  padding:9px 4px;border-bottom:1px solid var(--border-soft);}
.legend-row:last-child{border-bottom:none;}
.legend-row .name{display:flex;align-items:center;gap:9px;color:var(--text-secondary);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.total-line{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);
  font-size:12px;color:var(--text-muted);text-align:right;}

.res-row{display:grid;grid-template-columns:118px 1fr 42px;align-items:center;gap:12px;margin-bottom:16px;font-size:12.5px;}
.res-row:last-child{margin-bottom:0;}
.res-row .name{color:var(--text-secondary);}
.res-bar{background:var(--bg-input);border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--border-soft);}
.res-fill{height:100%;border-radius:8px;transition:width .4s ease;}
.res-row .pct{text-align:right;font-family:var(--font-mono);font-weight:600;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px 18px;position:relative;overflow:hidden;transition:border-color .15s;}
.stat-card:hover{border-color:var(--blue);}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--blue));}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--text-muted);margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.5px;}

.state-msg{text-align:center;padding:70px 20px;color:var(--text-muted);font-size:13.5px;}
.state-msg a{color:var(--blue-bright);}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-link" href="admin.html">← Back to Admin</a>
      <div class="topbar-title"><span class="live-dot"></span>Figure 6.5: System Throughput Analysis</div>
      <div class="topbar-sub">Real-time Performance Monitoring Dashboard</div>
    </div>
    <div class="chips" id="topChips"></div>
  </div>

  <div id="loading" class="spinner"></div>

  <div id="content" style="display:none">
    <div class="grid">
      <div class="card">
        <div class="card-title"><span>Requests Per Minute (RPM) Over Time</span><span class="badge-soft" id="dailyAvg"></span></div>
        <div class="chart-wrap rpm"><canvas id="rpmChart"></canvas></div>
        <div class="insight"><span class="ic">💡</span><span id="insightText"></span></div>
      </div>
      <div class="card">
        <div class="card-title"><span>Average Response Time</span></div>
        <div class="chart-wrap gauge"><canvas id="gaugeChart"></canvas></div>
        <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:10px" id="slaStatus"></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title"><span>Request Distribution by Endpoint</span></div>
        <div class="pie-row">
          <div class="chart-wrap pie"><canvas id="pieChart"></canvas></div>
          <div class="legend-list" id="pieLegend"></div>
        </div>
        <div class="total-line" id="totalRequests"></div>
      </div>
      <div class="card">
        <div class="card-title"><span>Resource Utilization</span></div>
        <div id="resourceBars" style="margin-top:4px"></div>
      </div>
    </div>

    <div class="stats" id="statCards"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('token');

function authHeader(){ return {'Authorization': `Bearer ${token}`, 'Content-Type':'application/json'}; }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function colorFor(pct, thresholds){ // thresholds = [warn, danger]
  if(pct >= thresholds[1]) return getCss('--red');
  if(pct >= thresholds[0]) return getCss('--orange');
  return getCss('--green');
}

const ENDPOINT_COLORS = {
  '/process-ticket': getCss('--blue')    || '#2a7fff',
  '/create-ticket':  getCss('--orange')  || '#f59e0b',
  '/analytics':      getCss('--green')   || '#10d88e',
  '/feedback':       getCss('--purple')  || '#a78bfa',
};

// Keep references so old Chart.js instances are destroyed before a
// redraw reuses the same <canvas> (avoids "Canvas is already in use").
let rpmChartInstance = null, gaugeChartInstance = null, pieChartInstance = null;

async function loadDashboard(){
  try{
    const r = await fetch('/analytics/system-metrics', { headers: authHeader() });
    if(!r.ok) throw new Error('request failed: ' + r.status);
    const d = await r.json();
    render(d);
  }catch(e){
    document.getElementById('loading').outerHTML =
      `<div class="state-msg">Couldn't load metrics (${e.message}). Make sure you're logged in as admin.</div>`;
  }
}

function render(d){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  const reportTime = new Date(d.report_time).toLocaleString();
  const withinSla = d.avg_response_time_ms <= d.sla_target_ms;
  document.getElementById('topChips').innerHTML = `
    <div class="chip peak"><span class="chip-icon">📈</span><span><span class="lbl">Peak Hour</span><span class="val">${d.peak_rpm} RPM</span></span></div>
    <div class="chip time"><span class="chip-icon">🕒</span><span><span class="lbl">Report Time</span><span class="val" style="font-size:12px">${reportTime}</span></span></div>
    <div class="chip uptime"><span class="chip-icon">💚</span><span><span class="lbl">Uptime</span><span class="val">${d.uptime_percent}%</span></span></div>
    <div class="chip sla"><span class="chip-icon">✓</span><span><span class="lbl">SLA Status</span><span class="val">${withinSla ? 'Within SLA' : 'Breach'}</span></span></div>`;

  document.getElementById('dailyAvg').textContent = `Daily Avg: ${d.daily_average_rpm} RPM`;

  // ── RPM line chart ──
  const hours = Array.from({length:24}, (_,i)=>`${String(i).padStart(2,'0')}:00`);
  if (rpmChartInstance) rpmChartInstance.destroy();
  rpmChartInstance = new Chart(document.getElementById('rpmChart'), {
    type:'line',
    data:{ labels:hours, datasets:[{
      label:'RPM (Requests/Minute)', data:d.rpm_over_time,
      borderColor:getCss('--blue')||'#2a7fff', backgroundColor:'rgba(42,127,255,0.15)',
      fill:true, tension:0.35, pointRadius:2.5, pointBackgroundColor:getCss('--blue')||'#2a7fff', borderWidth:2
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:getCss('--text-secondary'), boxWidth:14, font:{family:'Sora',size:11.5} } } },
      scales:{
        x:{ ticks:{color:getCss('--text-muted'), font:{size:10.5}}, grid:{color:'rgba(255,255,255,0.05)'} },
        y:{ beginAtZero:true, ticks:{color:getCss('--text-muted'), font:{size:10.5}}, grid:{color:'rgba(255,255,255,0.05)'} }
      }
    }
  });

  const peakIdx = d.rpm_over_time.indexOf(Math.max(...d.rpm_over_time));
  document.getElementById('insightText').textContent = d.rpm_over_time.some(v=>v>0)
    ? `Peak traffic observed around ${hours[peakIdx]}, averaging ${d.daily_average_rpm} RPM across the day.`
    : `No request traffic recorded yet — this will populate as tickets are processed.`;

  // ── Response-time gauge (semi-doughnut) ──
  const rt = d.avg_response_time_ms;
  const sla = d.sla_target_ms;
  const gaugeMax = Math.max(sla * 1.6, rt * 1.2, 100);
  if (gaugeChartInstance) gaugeChartInstance.destroy();
  gaugeChartInstance = new Chart(document.getElementById('gaugeChart'), {
    type:'doughnut',
    data:{ labels:['Response Time','Remaining'], datasets:[{
      data:[Math.min(rt,gaugeMax), Math.max(gaugeMax-rt,0)],
      backgroundColor:[colorFor(rt/sla*100,[70,100]), 'rgba(255,255,255,0.06)'],
      borderWidth:0
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      circumference:180, rotation:270, cutout:'72%',
      plugins:{ legend:{display:false}, tooltip:{enabled:false} }
    },
    plugins:[{
      id:'centerText',
      afterDraw(chart){
        const {ctx, chartArea:{width,height}} = chart;
        ctx.save();
        ctx.font='700 24px Sora, sans-serif'; ctx.fillStyle=getCss('--text-primary'); ctx.textAlign='center';
        ctx.fillText(`${rt}ms`, width/2, height*0.78);
        ctx.font='500 11px Sora, sans-serif'; ctx.fillStyle=getCss('--text-muted');
        ctx.fillText('Avg Response Time', width/2, height*0.78+18);
        ctx.restore();
      }
    }]
  });
  document.getElementById('slaStatus').innerHTML =
    `SLA Target: &lt; ${sla}ms &nbsp;•&nbsp; Status: <b style="color:${withinSla?getCss('--green'):getCss('--red')}">${withinSla?'Within SLA':'Above SLA'}</b>`;

  // ── Endpoint distribution pie ──
  const dist = d.endpoint_distribution || {};
  const labels = Object.keys(dist);
  const values = Object.values(dist);
  const colors = labels.map(l => ENDPOINT_COLORS[l] || '#8899b4');
  if(labels.length){
    if (pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById('pieChart'), {
      type:'pie',
      data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:2, borderColor:getCss('--bg-card')||'#111827' }]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} } }
    });
    document.getElementById('pieLegend').innerHTML = labels.map((l,i)=>`
      <div class="legend-row"><span class="name"><span class="dot" style="background:${colors[i]}"></span>${l}</span><b>${values[i]}%</b></div>`).join('');
  } else {
    if (pieChartInstance) { pieChartInstance.destroy(); pieChartInstance = null; }
    document.getElementById('pieLegend').innerHTML = `<div style="color:var(--text-muted);font-size:12px">No endpoint traffic recorded yet.</div>`;
  }
  document.getElementById('totalRequests').textContent = `Total Requests: ${d.total_requests_24h} (Last 24 Hours)`;

  // ── Resource utilization bars ──
  const res = d.resource_utilization;
  const bars = [
    {label:'CPU Usage',    pct:res.cpu_percent,    color:getCss('--blue')},
    {label:'Memory Usage', pct:res.memory_percent, color:getCss('--orange')},
    {label:'Disk I/O',     pct:res.disk_io_percent,color:getCss('--purple')},
  ];
  document.getElementById('resourceBars').innerHTML = bars.map(b=>`
    <div class="res-row">
      <span class="name">${b.label}</span>
      <div class="res-bar"><div class="res-fill" style="width:${Math.min(b.pct,100)}%;background:${b.color}"></div></div>
      <span class="pct">${b.pct.toFixed(0)}%</span>
    </div>`).join('');

  // ── Bottom stat cards ──
  document.getElementById('statCards').innerHTML = `
    <div class="stat-card" style="--accent:${getCss('--blue')}"><div class="stat-label">Total Requests (24h)</div><div class="stat-value">${d.total_requests_24h}</div></div>
    <div class="stat-card" style="--accent:${getCss('--green')}"><div class="stat-label">Peak RPM</div><div class="stat-value">${d.peak_rpm}</div></div>
    <div class="stat-card" style="--accent:${getCss('--purple')}"><div class="stat-label">Daily Average RPM</div><div class="stat-value">${d.daily_average_rpm}</div></div>
    <div class="stat-card" style="--accent:${getCss('--orange')}"><div class="stat-label">Avg Response Time</div><div class="stat-value">${d.avg_response_time_ms}ms</div></div>
    <div class="stat-card" style="--accent:${getCss('--green')}"><div class="stat-label">Uptime</div><div class="stat-value">${d.uptime_percent}%</div></div>`;
}

if(!token){
  document.getElementById('loading').outerHTML =
    `<div class="state-msg">Please <a href="login.html">log in as admin</a> to view this dashboard.</div>`;
} else {
  loadDashboard();
  setInterval(loadDashboard, 60000); // auto-refresh every 60s, matching Figure 6.5
}
</script>
</body>
</html>
